<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Ekanayake Motor Industries</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .syne { font-family: 'Syne', sans-serif; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px) scale(.97) } to { opacity:1; transform:none } }
  .box { animation: fadeUp .5s ease; }
  .inp { background:#F7F6F3; border:1.5px solid #E7E5E4; border-radius:10px; padding:11px 14px; font-size:14px; font-family:inherit; width:100%; outline:none; transition:all .2s; color:#1C1917; }
  .inp:focus { border-color:#DC2626; background:white; box-shadow:0 0 0 4px rgba(220,38,38,.08); }
  .inp::placeholder { color:#A8A29E; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#0C0A09">

  <!-- BACKGROUND GLOW -->
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(220,38,38,.12),transparent);pointer-events:none"></div>

  <div class="box w-full max-w-md mx-4">
    <div class="bg-white rounded-3xl p-10 shadow-2xl">

      <!-- LOGO -->
      <div class="flex items-center gap-3 mb-8">
        <div class="w-11 h-11 bg-red-600 rounded-xl flex items-center justify-center syne font-bold text-white text-xl shadow-lg shadow-red-900/30">E</div>
        <div>
          <div class="syne font-bold text-xl leading-none">EKANAYAKE <span class="text-red-600">MOTOR</span></div>
          <div class="text-stone-400 text-xs tracking-widest mt-0.5">ADMIN PANEL</div>
        </div>
      </div>

      <h2 class="syne font-bold text-2xl text-stone-900 mb-1">Welcome back</h2>
      <p class="text-stone-400 text-sm mb-7">Sign in to manage products and orders</p>

      <!-- ERROR MESSAGE -->
      {% if error %}
      <div class="flex items-center gap-3 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm mb-5">
        <span class="text-lg">⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- FORM — uses Flask POST (this is what your professor wants to see) -->
      <form method="POST" action="/admin/login">
        <div class="mb-4">
          <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">Email</label>
          <input type="email" name="email" class="inp" placeholder="admin@ekanayake.lk" required autofocus>
        </div>
        <div class="mb-7">
          <label class="block text-xs font-bold text-stone-500 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" name="password" class="inp" placeholder="••••••••" required>
        </div>
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white syne font-bold text-base tracking-wide rounded-xl py-3.5 transition-all hover:shadow-lg hover:shadow-red-200 active:scale-95">
          SIGN IN →
        </button>
      </form>

      <!-- BACK TO WEBSITE -->
      <div class="text-center mt-5">
        <a href="/" class="text-xs text-stone-400 hover:text-stone-600 transition">← Back to website</a>
      </div>

    </div>

    <!-- FOOTER NOTE -->
    <p class="text-center text-stone-600 text-xs mt-4">
      Protected admin area · Ekanayake Motor Industries
    </p>
  </div>

</body>
</html>
