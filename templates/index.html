<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekanayake Motor Industries</title>
  <!-- Tailwind CSS (CDN for development) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C0272D',
            dark: '#16213E',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-dark text-white px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-bold">
      <span class="text-white">Ekanayake</span>
      <span class="text-primary">Motors</span>
    </div>
    <a href="#catalog" 
       class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-700">
      Order Now
    </a>
  </nav>

  <!-- Product Grid -->
  <section id="catalog" class="max-w-7xl mx-auto px-4 py-10">
    <h2 class="text-3xl font-bold text-center mb-8">Spare Parts Catalog</h2>
    
    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-6" id="filters">
      <button onclick="filterProducts('all')" 
              class="filter-btn bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold">
        All
      </button>
      <button onclick="filterProducts('Toyota')"
              class="filter-btn bg-white border px-4 py-2 rounded-full text-sm font-semibold hover:bg-gray-100">
        Toyota
      </button>
      <!-- Add more filters -->
    </div>

    <!-- Count -->
    <p class="text-gray-500 mb-4" id="count">Loading...</p>
    
    <!-- Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4" 
         id="product-grid">
      <!-- Loading skeleton -->
      <div class="animate-pulse bg-gray-200 h-48 rounded-xl"></div>
      <div class="animate-pulse bg-gray-200 h-48 rounded-xl"></div>
      <div class="animate-pulse bg-gray-200 h-48 rounded-xl"></div>
    </div>
  </section>

<script>
let allProducts = [];
let filtered = [];

// Load products from Flask API
async function loadProducts() {
  const res = await fetch('/api/products');
  allProducts = await res.json();
  filtered = [...allProducts];
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById('product-grid');
  const count = document.getElementById('count');
  count.textContent = `Showing ${filtered.length} parts`;

  grid.innerHTML = filtered.map(p => `
    <div class="bg-white rounded-xl shadow-sm border hover:shadow-md 
                transition cursor-pointer p-3"
         onclick="openModal(${p.id})">
      <div class="h-32 bg-gray-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center">
        ${p.imgUrl 
          ? `<img src="${p.imgUrl}" class="w-full h-full object-contain" 
                  onerror="this.parentNode.innerHTML='🔧'">`
          : '<span class="text-4xl opacity-30">🔧</span>'
        }
      </div>
      <span class="text-xs text-gray-400">${p.num}</span>
      <h3 class="font-semibold text-sm mt-1">${p.type}</h3>
      <p class="text-xs text-gray-500">Fits: ${p.vehicles}</p>
      <div class="flex justify-between items-center mt-2">
        <span class="text-primary font-bold">Rs ${p.price.toLocaleString()}</span>
        <span class="text-xs px-2 py-1 rounded-full font-bold
                     ${p.mfg ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
          ${p.mfg ? 'MFG' : 'Stock'}
        </span>
      </div>
    </div>
  `).join('');
}

function filterProducts(brand) {
  filtered = brand === 'all' 
    ? [...allProducts]
    : allProducts.filter(p => p.brand === brand || p.type === brand);
  renderProducts();
}

// Load on page open
loadProducts();
</script>
</body>
</html>
