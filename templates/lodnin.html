<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
    <h1 class="text-2xl font-bold mb-6">Admin Login</h1>
    
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-4">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-600 mb-2">Email</label>
        <input type="email" name="email" required
               class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:border-red-500">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-2">Password</label>
        <input type="password" name="password" required
               class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:border-red-500">
      </div>
      <button type="submit"
              class="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700">
        Sign In →
      </button>
    </form>
  </div>
</body>
</html>
